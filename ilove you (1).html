<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Like Me? 🐼💕</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(to right, #ff758c, #ff7eb3); overflow: hidden; }
        .container { background: rgba(255, 255, 255, 0.2); padding: 25px; border-radius: 15px; backdrop-filter: blur(10px); box-shadow: 0px 8px 32px rgba(0, 0, 0, 0.2); text-align: center; width: 350px; position: relative; animation: float 3s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        h2 { color: white; font-size: 22px; margin-bottom: 20px; }
        .pandas { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .panda { width: 80px; height: 80px; transition: transform 0.3s; }
        .buttons { display: flex; justify-content: center; gap: 20px; }
        button { padding: 12px 20px; font-size: 16px; border: none; cursor: pointer; border-radius: 30px; transition: 0.3s; font-weight: bold; }
        #yesBtn { background-color: #4CAF50; color: white; box-shadow: 0 4px 10px rgba(0, 255, 0, 0.3); }
        #yesBtn:hover { background-color: #45a049; }
        #noBtn { background-color: #f44336; color: white; position: absolute; box-shadow: 0 4px 10px rgba(255, 0, 0, 0.3); }
        .heart { position: absolute; font-size: 20px; animation: hearts 2s infinite; }
        @keyframes hearts { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-100px) scale(1.5); opacity: 0; } }
        .credits { margin-top: 20px; font-size: 14px; color: white; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="question">Do you like me? 🥺💕</h2>
        
        <div class="pandas">
            <img id="panda1" src="https://i.imgur.com/MD1DTBs.png" alt="Cute Panda BF" class="panda">
            <img id="panda2" src="https://i.imgur.com/0XUez0v.png" alt="Cute Panda GF" class="panda">
        </div>

        <div class="buttons">
            <button id="yesBtn" onclick="nextStep()">Yes 😍</button>
            <button id="noBtn" onmouseover="moveButton()">No 😜</button>
        </div>
        <p class="credits">Make by Gaming Devil 🕹️🔥</p>
    </div>

    <audio id="bgMusic" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mp3">
    </audio>

    <script>
        let step = 0;
        const questions = [
            "Do you like me? 🥺💕",
            "Are you sure? 😳👉👈",
            "Really really sure? 🥹💕",
            "Pakka? 🥰💖",
            "Ab to bol do na! 😭💞",
            "I knew it! You love me! 😘💖"
        ];

        function nextStep() {
            if (step === 0) {
                document.getElementById("bgMusic").play(); // Start music on first click
            }
            if (step < questions.length - 1) {
                step++;
                document.getElementById("question").innerText = questions[step];
                updatePanda(step);
            } else {
                showPopup();
            }
        }

        function updatePanda(step) {
            let panda1 = document.getElementById("panda1");
            let panda2 = document.getElementById("panda2");

            if (step === questions.length - 1) {
                panda1.src = "https://i.imgur.com/6mFHEKy.png"; // Happy Panda
                panda2.src = "https://i.imgur.com/5L1J6pV.png"; // Blushing Panda
            }
        }

        function showPopup() {
            alert("Yay! 🥰 Let's be together forever! 💖");
            createHeart();
        }

        function moveButton() {
            let noBtn = document.getElementById("noBtn");
            let x = Math.random() * (window.innerWidth - 100);
            let y = Math.random() * (window.innerHeight - 100);
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        function createHeart() {
            let heart = document.createElement("div");
            heart.innerHTML = "❤️";
            heart.classList.add("heart");
            heart.style.left = Math.random() * 100 + "%";
            heart.style.top = "100%";
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 2000);
        }
    </script>

</body>
</html>
